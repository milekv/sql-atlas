name: Feature request
description: Propose an analyzer rule, dialect improvement, or integration feature
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What SQL review or development problem would this solve?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: SQL or workflow example
      description: Show a representative input and the result you would expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: The feature can run locally without sending SQL to a remote service.
          required: true
